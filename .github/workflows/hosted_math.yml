name: Lindblad rank-one hosted mathematics

on:
  push:
    branches:
      - merlin/rank-one-hosted-check-20261118

permissions:
  contents: read

env:
  SOURCE_REVISION: 5ac7c600135ad0bbb8f9e85e2b2130de021ff1cb

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser dependencies
        run: |
          git merge-base --is-ancestor "$SOURCE_REVISION" HEAD
          npm install --prefix "$RUNNER_TEMP/hosted-deps" --no-audit --no-fund playwright@1.56.1 mathjax-full@3.2.1
          "$RUNNER_TEMP/hosted-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Probe the rank-one proof on GitHub
        env:
          NODE_PATH: ${{ runner.temp }}/hosted-deps/node_modules
        run: |
          node verification/hosted/probe_hosted_math.cjs \
            --root "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" \
            --revision "$SOURCE_REVISION" --output "$RUNNER_TEMP/hosted-representative" \
            --page science/rank_one_time_law.md
      - name: Capture every tracked Markdown page at the scientific revision
        env:
          NODE_PATH: ${{ runner.temp }}/hosted-deps/node_modules
        run: |
          node verification/hosted/capture_hosted_math.cjs \
            --root "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" \
            --revision "$SOURCE_REVISION" --output "$RUNNER_TEMP/hosted-full"
      - name: Retain the structural and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lindblad-hosted-math-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hosted-representative
            ${{ runner.temp }}/hosted-full
          if-no-files-found: warn
          retention-days: 14
